<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/speech-radar.css">
</head>

<body>
    <div class="sr" id="app" data-state="idle">
        <header class="sr-top">
            <span>Undertone</span>
            <span class="sr-live">In ear</span>
        </header>

        <main class="sr-grid">
            <section class="sr-col sr-col-talk" aria-label="What they said">
                <div class="sr-feed" id="feed"></div>
            </section>

            <section class="sr-col sr-col-radar" aria-label="Listening">
                <div class="sr-radar" id="radar">
                    <div class="sr-ring"></div>
                    <div class="sr-ring sr-ring-2"></div>
                    <div class="sr-ring sr-ring-3"></div>
                    <div class="sr-sweep"></div>
                    <svg class="sr-beam" viewBox="0 0 100 100" aria-hidden="true">
                        <defs>
                            <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#c9a86a" stop-opacity="0" />
                                <stop offset="100%" stop-color="#c9a86a" stop-opacity="0.85" />
                            </linearGradient>
                        </defs>
                        <line id="beam-line" x1="50" y1="50" x2="74" y2="26" stroke="url(#beamGrad)" stroke-width="0.6" />
                    </svg>
                    <div class="sr-you">
                        <i></i>
                        <span>listener</span>
                    </div>
                    <div class="sr-blip" id="blip">
                        <i></i>
                        <span>speaker</span>
                    </div>
                </div>
                <div class="sr-wave-wrap">
                    <canvas id="wave" width="960" height="260"></canvas>
                    <div class="sr-callout" id="callout">
                        <span id="callout-emo"></span>
                        <span id="callout-pct"></span>
                    </div>
                </div>
            </section>

            <section class="sr-col sr-col-ear" aria-label="What you hear">
                <div class="sr-bud-wrap" id="bud">
                    <svg class="sr-bud" viewBox="0 0 72 120" fill="none" aria-hidden="true">
                        <path d="M36 8c12 0 22 10 22 22 0 9-5 16-12 20v46c0 8-5 14-10 14s-10-6-10-14V50c-7-4-12-11-12-20C14 18 24 8 36 8Z" fill="#eceae6" />
                        <ellipse cx="36" cy="30" rx="14" ry="16" fill="#cfc9c0" />
                        <ellipse cx="36" cy="30" rx="6" ry="7" fill="#8a847c" />
                        <rect x="32" y="50" width="8" height="44" rx="4" fill="#d8d3cc" />
                    </svg>
                    <p class="sr-whisper" id="whisper"></p>
                    <p class="sr-meta" id="meta"></p>
                </div>
            </section>
        </main>
    </div>

    <button type="button" class="sr-veil" id="veil">
        <span>Start scene</span>
        <small>Full screen, then record. About 40 seconds.</small>
    </button>

    <script src="js/speech-radar-demo.js"></script>
</body>

</html>
